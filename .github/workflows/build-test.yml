name: Build & Test

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore WhisperProject.sln

      - name: Build
        run: dotnet build WhisperProject.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WhisperProject.sln --configuration Release --no-build --verbosity normal
