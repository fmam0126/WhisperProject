name: Canary Release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

jobs:
  build-test-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore WhisperProject.sln

      - name: Build
        run: dotnet build WhisperProject.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WhisperProject.sln --configuration Release --no-build --verbosity normal

      - name: Publish Avalonia (Windows)
        run: dotnet publish WhisperProject.Avalonia/WhisperProject.Avalonia.csproj --configuration Release -r win-x64 -p:PublishSingleFile=true --self-contained true --output publish/avalonia-win

      - name: Zip Artifacts
        run: |
          cd publish/avalonia-win && zip -r ../avalonia-windows-x64.zip . && cd ../..

      - name: Delete existing canary release and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete canary --cleanup-tag -y || true

      - name: Create Canary Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create canary \
            --title "Canary Build" \
            --notes "Automated build from PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}<br>Commit: ${{ github.sha }}" \
            --prerelease \
            publish/avalonia-windows-x64.zip
